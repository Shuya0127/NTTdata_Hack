name: Send reaction notifications

on:
  schedule:
    # 5分おきに実行(GitHub側の負荷状況により実際は数分〜数十分の遅延が発生する)
    - cron: "*/5 * * * *"
  workflow_dispatch: # GitHub画面から手動実行するためのボタン

jobs:
  send-reaction-notifications:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを導入
        run: pip install -r requirements.txt

      - name: Firebaseの秘密鍵をファイルに書き出す
        run: echo '${{ secrets.FIREBASE_CREDENTIALS_JSON }}' > firebase-service-account.json

      - name: いいね・コメント・フレンド申請の通知を送信
        run: python send_reaction_notifications.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_CREDENTIALS_PATH: firebase-service-account.json
