name: Get and save daily news

on:
  schedule:
    # 日本時間の毎朝 8:00（UTCでは前日の23:00）
    - cron: "*/30 * * * *"
  workflow_dispatch: # GitHub画面から手動実行するためのボタン

jobs:
  get-news:
    runs-on: ubuntu-latest

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリを導入
        run: pip install -r requirements.txt

      - name: ニュースを取得して保存
        run: python get_news.py
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
